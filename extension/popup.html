<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptMask</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <h1>PromptMask</h1>
        <span class="status-text" id="active-pill">Active</span>
      </header>

      <section class="card" aria-labelledby="sites-title">
        <h2 class="card-title" id="sites-title">Sites</h2>
        <div class="setting-list">
          <div class="setting-row">
            <label class="toggle-label" for="site-chatgpt">ChatGPT</label>
            <label class="switch" aria-label="Toggle ChatGPT">
              <input type="checkbox" id="site-chatgpt" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="site-gemini">Gemini</label>
            <label class="switch" aria-label="Toggle Gemini">
              <input type="checkbox" id="site-gemini" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="site-claude">Claude</label>
            <label class="switch" aria-label="Toggle Claude">
              <input type="checkbox" id="site-claude" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="site-perplexity">Perplexity</label>
            <label class="switch" aria-label="Toggle Perplexity">
              <input type="checkbox" id="site-perplexity" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="site-grok">Grok</label>
            <label class="switch" aria-label="Toggle Grok">
              <input type="checkbox" id="site-grok" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="categories-title">
        <h2 class="card-title" id="categories-title">PII Categories</h2>
        <div class="setting-list">
          <div class="setting-row">
            <label class="toggle-label" for="cat-identityContact">Identity &amp; Contact</label>
            <label class="switch" aria-label="Toggle Identity and Contact">
              <input type="checkbox" id="cat-identityContact" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="cat-governmentLegal">Government &amp; Legal IDs</label>
            <label class="switch" aria-label="Toggle Government and Legal IDs">
              <input type="checkbox" id="cat-governmentLegal" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="cat-financialPayment">Financial &amp; Payment</label>
            <label class="switch" aria-label="Toggle Financial and Payment">
              <input type="checkbox" id="cat-financialPayment" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="cat-medical">Medical</label>
            <label class="switch" aria-label="Toggle Medical">
              <input type="checkbox" id="cat-medical" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="cat-credentialsSecrets">Credentials &amp; Secrets</label>
            <label class="switch" aria-label="Toggle Credentials and Secrets">
              <input type="checkbox" id="cat-credentialsSecrets" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="cat-networkDevice">Network &amp; Device</label>
            <label class="switch" aria-label="Toggle Network and Device">
              <input type="checkbox" id="cat-networkDevice" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="toggle-label" for="cat-businessCase">Business &amp; Case References</label>
            <label class="switch" aria-label="Toggle Business and Case References">
              <input type="checkbox" id="cat-businessCase" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <p class="status" id="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
